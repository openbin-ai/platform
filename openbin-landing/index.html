    <noscript>
      <main>
        <h1>OpenBin — free, open-source AI reverse engineering &amp; decompilation</h1>
        <p>
          <strong>OpenBin.ai</strong> (officially <strong>The Open Binary Project</strong>)
          is a free, open-source, collaborative platform for AI-assisted reverse
          engineering, decompilation, and malware analysis. Drop in a sample, plug in
          your own LLM key, and let intelligent agents help you decompile, understand,
          and debug unfamiliar code — then publish your findings and build on the work
          of other researchers. It runs in your browser; your projects live in the
          cloud, so your work is accessible anywhere and shareable with your team.
        </p>

        <h2>What you can analyze</h2>
        <ul>
          <li><strong>Native binaries</strong> — ELF, PE, and Mach-O executables, decompiled to pseudo-C with Ghidra and shown side-by-side with disassembly.</li>
          <li><strong>Android APKs</strong> — JADX decompilation with IDE-style navigation (via OpenAPK.ai).</li>
          <li><strong>npm packages</strong> — and loose JavaScript / TypeScript, for supply-chain malware review.</li>
          <li><strong>PyPI packages</strong> — and loose Python scripts.</li>
          <li><strong>PowerShell</strong> — .ps1 / .psm1 scripts.</li>
          <li><strong>Shell scripts</strong> — bash, sh, and zsh.</li>
        </ul>

        <h2>What it does</h2>
        <ul>
          <li>AI decompilation and reverse engineering with file:line citations on every answer.</li>
          <li>Side-by-side decompiled code and disassembly with Ghidra-style cross-highlighting.</li>
          <li>Call-chain tracing, crypto/obfuscation detection, and string &amp; import analysis.</li>
          <li>A collaborative community feed: publish reports, cite findings, credit researchers.</li>
          <li>Bring your own LLM key (Anthropic, OpenAI, AWS Bedrock) — you pay $0 for inference.</li>
        </ul>

        <h2>Free and open source</h2>
        <p>
          OpenBin is licensed under AGPL-3.0 and free for researchers. Source on
          <a href="https://github.com/openbin-ai/platform">GitHub</a>.
        </p>

        <h2>Get started</h2>
        <ul>
          <li><a href="https://app.openbin.ai/">Open the OpenBin web app</a> — native binary reverse engineering.</li>
          <li><a href="https://openapk.ai/">OpenAPK.ai</a> — Android APK reverse engineering.</li>
          <li><a href="https://app.openbin.ai/community">Browse the community</a> — public reverse-engineering reports.</li>
          <li><a href="https://github.com/openbin-ai/platform/releases/latest">Download the CLI</a> — decompile native binaries locally.</li>
        </ul>
      </main>
