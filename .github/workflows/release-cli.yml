name: release-cli

# Push a tag matching `openbin-v*` (e.g. `openbin-v0.1.0-alpha`) to cut a
# release. Produces:
#   - openbin-<os>-<arch>.tar.gz   per-platform, SLIM: just the CLI binary
#                                  + README (no worker image inside).
#   - jadx-worker.tar.gz           bundled JADX image (APK decompile)
#   - ghidra-worker.tar.gz         bundled Ghidra image (native binary RE)
#
# The slim CLI tarball keeps the one-liner installer (openbin.ai/install.sh)
# fast — it only fetches the ~10 MB binary. The worker images are large
# (jadx ~350 MB / ghidra ~700 MB gzipped) and are downloaded lazily by the
# CLI the first time `openbin apk` / `openbin decompile` runs, via GitHub's
# stable `releases/latest/download/<asset>` URL. No registry login required.
#
# Asset names are intentionally version-LESS so the `latest/download/<name>`
# URL is stable across releases (both the installer and the CLI rely on it).
# The version still lives in the git tag and is baked into the binary via
# -ldflags so `openbin --version` is accurate.

on:
  push:
    tags:
      - 'openbin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release as (e.g. openbin-v0.1.0-alpha)'
        required: true

permissions:
  contents: write   # needed to create the GitHub release

jobs:
  build-images:
    name: Build + save worker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # buildx caches layers between runs so the heavy base downloads
      # (Ghidra ~600 MB) are only paid once unless the Dockerfile changes.
      - name: Build + save jadx-worker image
        run: |
          docker buildx build --load \
            --tag openapk/jadx-worker:bundled \
            --cache-from=type=gha,scope=jadx \
            --cache-to=type=gha,mode=max,scope=jadx \
            ./jadx-worker
          docker save openapk/jadx-worker:bundled | gzip > jadx-worker.tar.gz
          ls -lh jadx-worker.tar.gz

      # The ghidra-worker tag is a versioned cache key — bump it whenever the
      # worker output changes so the CLI re-downloads instead of reusing a
      # stale local image. MUST stay in lockstep with `ghidraWorkerImage` in
      # cli/config.go. The tarball NAME stays version-less (stable URL); only
      # the image tag inside it is versioned.
      - name: Build + save ghidra-worker image
        run: |
          docker buildx build --load \
            --tag openbin/ghidra-worker:4 \
            --cache-from=type=gha,scope=ghidra \
            --cache-to=type=gha,mode=max,scope=ghidra \
            ./ghidra-worker
          docker save openbin/ghidra-worker:4 | gzip > ghidra-worker.tar.gz
          ls -lh ghidra-worker.tar.gz

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-images
          path: |
            jadx-worker.tar.gz
            ghidra-worker.tar.gz
          retention-days: 1

  create-release:
    name: Create the GitHub release (once)
    runs-on: ubuntu-latest
    steps:
      # Create the release ONCE, up front, so every asset-upload job below only
      # ever UPDATES an existing release. Previously each of the four CLI matrix
      # jobs raced to create it concurrently and all but one died with
      # "Validation Failed: already_exists (tag_name)". This job owns creation +
      # release notes; the matrix / image / VERSION jobs just attach files.
      - name: Create release (empty, notes generated)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true

  release:
    name: Build CLI ${{ matrix.os }}/${{ matrix.arch }}
    needs: [build-images, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Linux + macOS only. Windows is intentionally out — see
        # [[desktop-client-and-windows-upsell]]; openbin is a Unix-first
        # tool and we drive Windows users to the paid cloud path instead.
        include:
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum

      - name: Cross-compile CLI
        working-directory: cli
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          ver="${{ github.event.inputs.tag || github.ref_name }}"
          short_ver="${ver#openbin-}"
          # -trimpath + -s -w strip build paths and debug/symbol tables
          # (~half the size). -X stamps the version for `openbin --version`.
          go build -trimpath \
            -ldflags="-s -w -X main.version=${short_ver}" \
            -o openbin .
          ls -lh openbin

      - name: Assemble slim CLI tarball
        run: |
          # Version-LESS package name so releases/latest/download/<name> is
          # a stable URL the installer can hardcode.
          pkg="openbin-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir "$pkg"
          mv cli/openbin   "$pkg/"
          cp cli/README.md "$pkg/"
          tar czf "$pkg.tar.gz" "$pkg/"
          ls -lh "$pkg.tar.gz"

      # The release already exists (create-release job) → this only uploads the
      # asset. No generate_release_notes here: notes are owned by create-release,
      # and regenerating them from four parallel jobs is what caused the race.
      - name: Attach CLI tarball to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: openbin-*.tar.gz
          fail_on_unmatched_files: true

  attach-images:
    name: Attach worker images to release
    needs: [build-images, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-images

      - name: Attach images to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            jadx-worker.tar.gz
            ghidra-worker.tar.gz
          fail_on_unmatched_files: true

  attach-version:
    name: Publish VERSION marker (powers `openbin update` nudge)
    needs: release
    runs-on: ubuntu-latest
    steps:
      # A tiny version-less asset the CLI fetches via the stable
      # releases/latest/download/VERSION URL to detect when a newer release
      # exists — no GitHub API, no token, no rate limit. Matches the version
      # baked into the binary via -ldflags.
      - name: Write VERSION
        run: |
          ver="${{ github.event.inputs.tag || github.ref_name }}"
          printf '%s' "${ver#openbin-}" > VERSION
          cat VERSION
      - name: Attach VERSION to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: VERSION
          fail_on_unmatched_files: true
