spring:
  application:
    name: openapk-core

  datasource:
    url: jdbc:postgresql://localhost:5432/openapk
    username: openapk
    password: openapk

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/openapk

  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
      readiness:
        # Default (only_if_started) — Postgres has a healthcheck so Spring waits for
        # it before Flyway runs. Keycloak has no healthcheck (see compose.yaml) and is
        # treated as ready once the container is running; JWKS is fetched lazily.
        wait: only_if_started

  ai:
    anthropic:
      api-key: disabled-byok-only
    openai:
      api-key: disabled-byok-only

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      # CLI APK ingest sends two parts in one request (the APK + the
      # decompiled tree tar.gz), so the request cap is 2x the file cap.
      max-request-size: 400MB
      file-size-threshold: 10MB

server:
  port: 8081
  tomcat:
    max-swallow-size: 200MB
  # Spring Boot 4 hides ResponseStatusException reasons from JSON error
  # bodies by default (server.error.include-message=never), so 4xx responses
  # only carry status + timestamp + path. We rely on the reason text for
  # actionable user feedback (encrypted-zip explanation, oversized upload,
  # etc.) so flip this to ALWAYS. Stacktrace flag stays off — no internals leak.
  error:
    include-message: always

openapk:
  crypto:
    # Base64-encoded 32-byte AES-256 master key. Generate with:
    #   openssl rand -base64 32
    # MUST be set via env. App fails fast on startup if missing or wrong length.
    master-key-b64: ${OPENAPK_KEK_B64:THdUzn8QDb//mvCPHogD76/rO9cdfsAAlBkCIPnptRo=}
  cors:
    allowed-origins:
      - http://localhost:5173  # openapk-frontend dev
      - http://localhost:5174  # openbin-frontend dev
  workspace:
    # Where uploaded APKs and JADX-decompiled output are stored on disk.
    # Resolved relative to the working directory if not absolute.
    # When storage.backend=s3, this dir doubles as the local cache for
    # active projects (LRU-evicted under disk pressure).
    dir: ${OPENAPK_WORKSPACE_DIR:./workspace}
  storage:
    # Where project bytes live durably.
    #   fs — workspace dir is the source of truth (dev default; no AWS needed).
    #   s3 — S3 is the source of truth; workspace dir is a per-task LRU cache.
    # Switch to s3 in prod by setting OPENAPK_STORAGE_BACKEND=s3 plus the s3.*
    # values below. The same ProjectStorage interface is used either way so
    # downstream services don't change.
    backend: ${OPENAPK_STORAGE_BACKEND:fs}
    # When the workspace dir's free space drops below this percentage, the
    # LRU evictor removes the projects that were touched longest ago. Only
    # consulted when backend=s3 (with backend=fs we never delete cached data).
    cache-min-free-percent: ${OPENAPK_STORAGE_CACHE_MIN_FREE_PCT:20}
    # How long presigned media URLs are valid. Short enough that a leaked URL
    # is low-impact; long enough that a slow page load doesn't 403 partway.
    presigned-url-ttl: ${OPENAPK_PRESIGNED_TTL:PT15M}
    s3:
      bucket: ${OPENAPK_S3_BUCKET:}
      region: ${OPENAPK_S3_REGION:us-east-1}
      # Optional key prefix — useful to share a bucket across dev/staging/prod
      # by namespacing each env. Empty means project keys live at the bucket root.
      prefix: ${OPENAPK_S3_PREFIX:}
      # Optional endpoint override — point at MinIO for local prod-parity testing
      # (see core/compose.yaml). Empty means real AWS S3.
      endpoint: ${OPENAPK_S3_ENDPOINT:}
  analysis-storage:
    # Dedicated bucket for BIN analysis blobs (the Ghidra worker JSON the
    # CLI uploads via presigned PUT). Decoupled from `storage` above so
    # dev can keep media on disk while still exercising S3 ingest.
    # Leave bucket blank to disable analysis-S3 entirely — Spring won't
    # create the beans and the new /ingest/initiate endpoint returns 503.
    bucket: ${OPENAPK_ANALYSIS_S3_BUCKET:}
    region: ${OPENAPK_ANALYSIS_S3_REGION:us-east-1}
    prefix: ${OPENAPK_ANALYSIS_S3_PREFIX:analysis}
    endpoint: ${OPENAPK_ANALYSIS_S3_ENDPOINT:}
    # TTLs scoped tight so leaked URLs collapse fast. PUT longer than GET
    # because a slow CLI upload (200MB on flaky wifi) needs a window.
    presigned-put-ttl: ${OPENAPK_ANALYSIS_PUT_TTL:PT15M}
    presigned-get-ttl: ${OPENAPK_ANALYSIS_GET_TTL:PT5M}
    cloudfront:
      # Domain of the CloudFront distribution fronting the bucket. Frontend
      # fetches signed URLs like https://${distribution-domain}/${s3-key}.
      distribution-domain: ${OPENAPK_ANALYSIS_CF_DOMAIN:}
      # Public-key ID assigned by CloudFront when the keypair was uploaded.
      key-pair-id: ${OPENAPK_ANALYSIS_CF_KEY_PAIR_ID:}
      private-key:
        # "file" in dev (reads PEM from filesystem path);
        # "secretsmanager" in prod (reads PEM from Secrets Manager).
        source: ${OPENAPK_ANALYSIS_CF_PK_SOURCE:file}
        file-path: ${OPENAPK_ANALYSIS_CF_PK_FILE:}
        secret-arn: ${OPENAPK_ANALYSIS_CF_PK_SECRET_ARN:}
  projects:
    # Max bytes returned by GET /api/projects/{id}/files/**. Files larger than this
    # are reported as "too large" rather than streamed in full (a UX guardrail; the
    # AI-driven analysis in slice 3 will read files server-side without this limit).
    max-file-response-bytes: 1048576
  ghidra:
    # Ghidra worker microservice (Python FastAPI + analyzeHeadless). Runs in its
    # own container; see ghidra-worker/ at the repo root. Override per-env with
    # OPENAPK_GHIDRA_WORKER_URL.
    worker-url: ${OPENAPK_GHIDRA_WORKER_URL:http://localhost:8000}
    # Hard cap on a single /analyze HTTP call. Must exceed the worker's own
    # subprocess timeout (default 25m, configurable via GHIDRA_ANALYZE_TIMEOUT
    # in the worker env). With aggressive function-start search enabled,
    # stripped libs can take 15-20 min; this gives 5m of headroom.
    worker-timeout: PT30M
    # 2026-06-03: cloud Ghidra disabled. AWS compute cost outpaced what a free
    # OSS project can carry. Users get pointed at the desktop CLI which runs
    # Ghidra on their own machine — see GhidraSunsetMessage.TEXT. Flip back to
    # false (or set OPENAPK_GHIDRA_DISABLED=false) once sponsorship lands.
    worker-disabled: ${OPENAPK_GHIDRA_DISABLED:true}
  jadx:
    # JADX worker microservice (Python FastAPI + jadx CLI). Runs in its own
    # container; see jadx-worker/ at the repo root. Replaces the in-JVM jadx
    # integration so a hostile APK can't OOM the backend.
    worker-url: ${OPENAPK_JADX_WORKER_URL:http://localhost:8001}
    # Hard cap on a single /decompile HTTP call. Must exceed the worker's own
    # JADX_TIMEOUT_SEC (default 15m). Big games take 5+ minutes; we give 5m
    # of headroom so legitimate decompiles don't get killed at the edge.
    worker-timeout: PT20M
    # Shared secret sent as X-Worker-Token. The worker's ECS Express endpoint
    # is publicly reachable; it 401s /decompile without this when its own
    # WORKER_TOKEN env is set. Blank = no header (local dev).
    worker-token: ${OPENAPK_JADX_WORKER_TOKEN:}
    # 2026-06-11: cloud JADX disabled, same story as Ghidra below — the
    # always-on worker was the biggest line on the AWS bill. APK uploads
    # without a CLI-decompiled tree get JadxSunsetMessage.TEXT; the desktop
    # CLI runs the identical jadx-worker container locally and uploads the
    # result. Flip to false (or set OPENAPK_JADX_DISABLED=false) to re-enable
    # cloud decompile — dev.sh does this for local development.
    worker-disabled: ${OPENAPK_JADX_DISABLED:true}
  script-analyzer:
    # Lambda-backed malicious-NPM analyzer. Scale-to-zero compute for a
    # sporadic, bounded workload — the only Lambda in the stack (everything
    # else runs on ECS Express). Off by default in dev so missing function
    # config doesn't break boot; flip to true in prod after the function +
    # IAM role + ECR repo exist (see memory/js_script_analyzer_plan.md).
    enabled: ${OPENAPK_SCRIPT_ANALYZER_ENABLED:false}
    lambda-function-name: ${OPENAPK_SCRIPT_ANALYZER_FUNCTION:openapk-script-worker-js}
    # JS-2: PyPI worker (Python 3.12 Lambda image). Spring sniffs the upload
    # and routes to whichever ecosystem matches — npm by default, pypi when
    # the archive contains setup.py / pyproject.toml / PKG-INFO / a wheel
    # dist-info dir.
    pypi-lambda-function-name: ${OPENAPK_PYPI_ANALYZER_FUNCTION:openapk-pypi-worker}
    # JS-3: loose-shell worker (Python 3.12 Lambda image, regex-based).
    # Routed to by extension: .ps1 / .psm1 / .sh / .bash / .zsh. No archive
    # sniffing needed — shell uploads are always single-file or a flat zip.
    shell-lambda-function-name: ${OPENAPK_SHELL_ANALYZER_FUNCTION:openapk-shell-worker}
    region: ${OPENAPK_SCRIPT_ANALYZER_REGION:us-east-1}
    # Hard cap on the upload (tarball, zip, single .js, or client-zipped
    # folder). Real malicious packages are tiny — <2MB — but unpacked
    # monorepos can spill over 10MB once you include test fixtures, so 25MB
    # is the sweet spot between "fits a real audit" and "obvious DoS".
    max-upload-bytes: ${OPENAPK_SCRIPT_ANALYZER_MAX_UPLOAD:26214400}
    # Wall-clock cap on a sync Lambda invoke. Must exceed the Lambda's own
    # timeout (60s default) so we don't disconnect a still-working run.
    invoke-timeout: ${OPENAPK_SCRIPT_ANALYZER_TIMEOUT:PT90S}
  workers:
    # Phase 0 emergency quota: per-user daily cap on cloud worker dispatches
    # (Ghidra + JADX combined). Stops the AWS bill from running away while
    # the desktop CLI and proper credits system ship. Counts every dispatch,
    # in-flight or completed, against the UTC-day window. Override via
    # OPENAPK_WORKERS_DAILY_CAP — set to 0 (or any non-positive) to disable
    # the gate entirely (back to unlimited).
    daily-cap-per-user: ${OPENAPK_WORKERS_DAILY_CAP:5}
  email:
    # AWS SES outbound config. Leaving region/abuse-to blank disables email
    # entirely (every send is a no-op log line) — fine for local dev.
    # Set OPENAPK_SES_REGION + OPENAPK_ABUSE_FROM + OPENAPK_ABUSE_TO in prod
    # (sender must be a verified identity in that SES region).
    region: ${OPENAPK_SES_REGION:}
    abuse-from: ${OPENAPK_ABUSE_FROM:}
    abuse-to: ${OPENAPK_ABUSE_TO:}
  tos:
    # Current Terms-of-Service version. Compared against
    # users.tos_accepted_version by TosAcceptanceFilter; mismatch trips a
    # 412 on /api/** and the frontend shows the blocking acceptance modal.
    # Bump in lockstep with the "Effective" date in
    # src/main/resources/legal/tos.md whenever you make a material change
    # — every user will be forced to re-accept on next API call.
    current-version: ${OPENAPK_TOS_VERSION:2026-06-05}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    ai.openapk: DEBUG
