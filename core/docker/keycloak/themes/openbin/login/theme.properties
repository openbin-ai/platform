# OpenBin custom login theme.
#
# Extends Keycloak's v2 (Patternfly 5) theme, only overrides CSS + adds an
# OpenBin logo at the top of the login card. Templates inherit from
# keycloak.v2 — no .ftl overrides needed for the v1 of this theme.
#
# Bumping the theme requires `kc.sh build` to be re-run; the Dockerfile in
# this directory does that automatically when the image is built.

parent=keycloak.v2
import=common/keycloak

styles=css/styles.css
