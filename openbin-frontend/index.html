<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Apply the stored theme before first paint (dark is the classless
         default; color-scheme comes from shared/theme/light.css). -->
    <script>
      try {
        if (localStorage.getItem('openbin.theme') === 'light') {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f7f9')
        }
      } catch (e) { /* private mode */ }
    </script>
    <title>OpenBin.ai</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
